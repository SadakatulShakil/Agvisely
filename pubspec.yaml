name: agvisely
description: "Agvisely — localized weather forecasts and agricultural advisory (DAE)"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State / architecture
  get: ^4.6.6
  flutter_screenutil: ^5.9.3

  # Storage & offline
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.0.0
  floor: ^1.5.0
  sqflite: ^2.4.1

  # Networking
  http: ^1.2.2
  connectivity_plus: ^7.0.0

  # Firebase / notifications
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  firebase_app_check: ^0.4.1
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.0
  permission_handler: ^12.0.1

  # Location
  geolocator: ^14.0.2

  # UI / media / misc
  flutter_svg: ^2.2.0
  lottie: ^3.3.1
  fl_chart: ^0.71.0
  image_picker: ^1.1.2
  file_picker: ^10.2.0
  url_launcher: ^6.2.5
  package_info_plus: ^9.0.0
  in_app_update: ^4.2.5
  intl: ^0.18.1
  flutter_native_splash: ^2.4.7

  # Advisory content export
  pdf: ^3.12.0
  printing: ^5.14.3
  bangla_pdf: ^1.2.0
  flutter_image_compress: ^2.5.1
  mime: ^2.1.0
  http_parser: ^4.1.2
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  floor_generator: ^1.5.0
  build_runner: ^2.4.6
  rename: ^3.1.0

# flutter_html 3.0.0 calls an internal `html` package function
# (package:html/src/query_selector.dart's top-level `matches()`) that was
# removed in html 0.15.7 — pin back to the last version that still has it
# until flutter_html ships a fix.
dependency_overrides:
  html: 0.15.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/svg/
    - assets/icons/nav_bar/
    - assets/icons/weather_icons/
    - assets/json/

  fonts:
    - family: AnekBangla
      fonts:
        - asset: assets/fonts/AnekBangla-Regular.ttf
        - asset: assets/fonts/AnekBangla-Medium.ttf
          weight: 500
        - asset: assets/fonts/AnekBangla-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AnekBangla-Bold.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
